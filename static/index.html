<!DOCTYPE html>
<html>
<head>
    <title>Trading Battles Chart</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #chart { width: 100%; height: 600px; border: 1px solid #ccc; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Candle Data Visualization</h1>
    <div>
        <input type="text" id="room" placeholder="Room ID" value="room1">
        <input type="text" id="symbol" placeholder="Enter Symbol (e.g. AAPL)" value="AAPL">
        <button onclick="loadChart()">Join Room</button>
    </div>
    <div id="chart"></div>

    <script>
        let chart;
        let candleSeries;

        function initChart() {
            const chartContainer = document.getElementById('chart');
            chartContainer.innerHTML = ''; // Clear previous chart if any
            
            const chartOptions = { 
                layout: { 
                    textColor: 'black', 
                    background: { type: 'solid', color: 'white' } 
                },
                width: chartContainer.clientWidth,
                height: 600,
            };
            chart = LightweightCharts.createChart(chartContainer, chartOptions);
            candleSeries = chart.addCandlestickSeries({
                upColor: '#26a69a', 
                downColor: '#ef5350', 
                borderVisible: false, 
                wickUpColor: '#26a69a', 
                wickDownColor: '#ef5350',
            });
            
            // Handle resize
            window.addEventListener('resize', () => {
                chart.applyOptions({ width: chartContainer.clientWidth });
            });
        }

        async function loadChart() {
            const symbol = document.getElementById('symbol').value;
            const room = document.getElementById('room').value;
            if (!symbol || !room) {
                alert("Please enter both Room ID and Symbol");
                return;
            }

            if (!chart || !candleSeries) initChart();
            
            // Clear existing data and start stream
            candleSeries.setData([]);
            connectWebSocket(room, symbol);
        }

        function connectWebSocket(room, symbol) {
            const ws = new WebSocket(`ws://${window.location.host}/candles/ws/${room}/${symbol}`);
            
            // Aggregate 1-minute candles into 1-hour candles
            const TIMEFRAME = 3600; 
            
            let currentCandle = null;
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                if (data.error) {
                    console.error(data.error);
                    return;
                }

                const price = data.close;
                const timestamp = data.time;
                
                // Determine the start time of the 1-hour bucket
                const candleTime = Math.floor(timestamp / TIMEFRAME) * TIMEFRAME;
                
                if (currentCandle && currentCandle.time === candleTime) {
                    // Update existing 1-hour candle
                    currentCandle.close = price;
                    currentCandle.high = Math.max(currentCandle.high, price);
                    currentCandle.low = Math.min(currentCandle.low, price);
                    currentCandle.volume += data.volume;
                } else {
                    // Start new 1-hour candle
                    currentCandle = {
                        time: candleTime,
                        open: data.open,
                        high: data.high,
                        low: data.low,
                        close: data.close,
                        volume: data.volume
                    };
                }
                
                candleSeries.update(currentCandle);
            };
            
            ws.onclose = () => console.log("WebSocket disconnected");
        }
    </script>
</body>
</html>
